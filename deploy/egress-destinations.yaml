default: deny
cloudflared_enabled: false
destinations:
  - name: anthropic-api
    users: [litellm]
    hosts: [api.anthropic.com]
    port: 443
    proto: tcp
    optional: true
    env: ANTHROPIC_BAA_ENABLED
    env_value: "true"
    purpose: Anthropic Claude API under Cap's BAA, including ZDR. Omitted unless the switch is on.
  - name: entra
    users: [openwebui]
    hosts:
      - login.microsoftonline.com
      - login.microsoft.com
    port: 443
    proto: tcp
    purpose: Entra ID OIDC for Open WebUI
  - name: ubuntu-updates
    users: [root]
    hosts:
      - archive.ubuntu.com
      - security.ubuntu.com
    ports: [80, 443]
    proto: tcp
    purpose: unattended-upgrades and apt
  - name: pypi
    users: [root]
    hosts:
      - pypi.org
      - files.pythonhosted.org
    port: 443
    proto: tcp
    install_only: true
    purpose: hashed pip installs during apply, as root. Dropped after install.
  - name: caddy-apt
    users: [root]
    hosts: [dl.cloudsmith.io]
    port: 443
    proto: tcp
    purpose: Caddy apt repository
  - name: spacy-model
    users: [root]
    hosts:
      - github.com
      - release-assets.githubusercontent.com
    port: 443
    proto: tcp
    install_only: true
    purpose: pinned en_core_web_lg wheel during apply, as root. Dropped after install.
  - name: embedding-model
    users: [root]
    hosts:
      - huggingface.co
      - cdn-lfs.huggingface.co
      - cas-bridge.xethub.hf.co
    port: 443
    proto: tcp
    install_only: true
    purpose: one-time local MiniLM download during apply. Dropped after install. The openwebui user cannot reach these hosts.
  - name: ntp
    users: [systemd-timesync]
    hosts:
      - ntp.ubuntu.com
    port: 123
    proto: udp
    purpose: time sync via systemd-timesyncd. The client queries ntp.ubuntu.com via the timesyncd drop-in. UDP has no SNI. Not a Cloudflare host.
  - name: azure-openai
    users: [litellm]
    env: AZURE_API_HOST
    host_suffix: .openai.azure.com
    port: 443
    proto: tcp
    optional: true
    purpose: Azure OpenAI host on the Presidio-gated path. The egress proxy dials this name only when AZURE_API_HOST is set. US regions only.
  - name: dns
    users: [systemd-resolve, root]
    env: DNS_SERVERS
    port: 53
    proto: udp
    optional: true
    purpose: configured resolvers only; stub resolver on loopback needs no rule
  - name: siem
    users: [root]
    env: SIEM_HOST
    port_env: SIEM_PORT
    proto: tcp
    optional: true
    purpose: audit shipping
  - name: stackjack
    users: [policy-gateway]
    env: STACKJACK_MCP_HOST
    port: 443
    proto: tcp
    optional: true
    purpose: MCP upstream, disabled until an explicit host is set
  - name: composio
    users: [policy-gateway]
    env: COMPOSIO_MCP_HOST
    port: 443
    proto: tcp
    optional: true
    purpose: MCP upstream, disabled until an explicit host is set. The policy gateway reaches it through 127.0.0.1:8891.
