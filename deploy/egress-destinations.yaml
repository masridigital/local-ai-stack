default: deny
cloudflared_enabled: false
destinations:
  - name: anthropic-api
    users: [litellm]
    hosts: [api.anthropic.com]
    port: 443
    proto: tcp
    purpose: Anthropic Claude API under Cap's BAA, including ZDR
  - name: entra
    users: [openwebui]
    hosts:
      - login.microsoftonline.com
      - login.microsoft.com
    port: 443
    proto: tcp
    purpose: Entra ID OIDC for Open WebUI
  - name: ubuntu-updates
    users: [root]
    hosts:
      - archive.ubuntu.com
      - security.ubuntu.com
    ports: [80, 443]
    proto: tcp
    purpose: unattended-upgrades and apt
  - name: pypi
    users: [root]
    hosts:
      - pypi.org
      - files.pythonhosted.org
    port: 443
    proto: tcp
    purpose: hashed pip installs during apply, as root
  - name: caddy-apt
    users: [root]
    hosts: [dl.cloudsmith.io]
    port: 443
    proto: tcp
    purpose: Caddy apt repository
  - name: cloudflared-apt
    users: [root]
    hosts: [pkg.cloudflare.com]
    port: 443
    proto: tcp
    purpose: cloudflared apt repository, not the tunnel
  - name: spacy-model
    users: [root]
    hosts:
      - github.com
      - release-assets.githubusercontent.com
    port: 443
    proto: tcp
    purpose: pinned en_core_web_lg wheel during apply, as root
  - name: embedding-model
    users: [root]
    hosts:
      - huggingface.co
      - cdn-lfs.huggingface.co
      - cas-bridge.xethub.hf.co
    port: 443
    proto: tcp
    purpose: one-time local MiniLM download during apply; the openwebui user cannot reach these hosts
  - name: ntp
    users: [systemd-timesync]
    hosts: [time.cloudflare.com]
    port: 123
    proto: udp
    purpose: time sync via systemd-timesyncd
  - name: azure-openai
    users: [litellm]
    env: AZURE_API_HOST
    host_suffix: .openai.azure.com
    port: 443
    proto: tcp
    optional: true
    purpose: Azure OpenAI resource hostname, US regions only (eastus2 or westus3 and the other US regions in policy.yaml)
  - name: dns
    users: [systemd-resolve, root]
    env: DNS_SERVERS
    port: 53
    proto: udp
    optional: true
    purpose: configured resolvers only; stub resolver on loopback needs no rule
  - name: siem
    users: [root]
    env: SIEM_HOST
    port_env: SIEM_PORT
    proto: tcp
    optional: true
    purpose: audit shipping
  - name: stackjack
    users: [policy-gateway]
    env: STACKJACK_MCP_HOST
    port: 443
    proto: tcp
    optional: true
    purpose: MCP upstream, disabled until an explicit host is set
  - name: composio
    users: [policy-gateway]
    env: COMPOSIO_MCP_HOST
    port: 443
    proto: tcp
    optional: true
    purpose: MCP upstream, disabled until an explicit host is set
  - name: cloudflared
    users: [cloudflared]
    hosts:
      - region1.v2.argotunnel.com
      - region2.v2.argotunnel.com
    port: 7844
    proto: tcp
    enabled: false
    purpose: tunnel connector for a future non-PHI path; never Open WebUI or LiteLLM
