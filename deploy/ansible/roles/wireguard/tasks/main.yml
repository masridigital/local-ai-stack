---
- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present

- name: Create the WireGuard directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the WireGuard example without a private key
  ansible.builtin.template:
    src: wg0.conf.example.j2
    dest: "{{ wireguard_example_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Record whether a WireGuard private key was provided
  ansible.builtin.set_fact:
    wireguard_key_present: "{{ wireguard_private_key | length > 0 }}"
  no_log: true
  when: wireguard_manage_config | bool

- name: Refuse to manage WireGuard without a real key
  ansible.builtin.assert:
    that:
      - wireguard_key_present | bool
      - wireguard_peers | rejectattr('public_key', 'equalto', '') | list | length == wireguard_peers | length
    fail_msg: >-
      wireguard_manage_config requires wireguard_private_key and a public key
      for every peer. Pass them from Ansible Vault. Do not commit them.
  when: wireguard_manage_config | bool

- name: Install the WireGuard interface config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_config_path }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - wireguard_manage_config | bool
    - wireguard_private_key | length > 0
  no_log: true
  notify: Restart WireGuard

- name: Check for a WireGuard interface config
  ansible.builtin.stat:
    path: "{{ wireguard_config_path }}"
  register: wireguard_config

- name: Enable WireGuard when an interface config exists
  ansible.builtin.systemd:
    name: wg-quick@wg0.service
    enabled: true
    state: started
    daemon_reload: true
  when: wireguard_config.stat.exists

- name: Leave WireGuard stopped when no interface config exists
  ansible.builtin.systemd:
    name: wg-quick@wg0.service
    enabled: false
    state: stopped
    daemon_reload: true
  when: not wireguard_config.stat.exists
