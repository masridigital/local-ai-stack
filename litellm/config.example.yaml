# EXAMPLE ONLY — placeholders. Runtime config is litellm/config.yaml plus litellm/policy.yaml.
# azure_ai/ is disabled by default (may fall outside Microsoft's BAA).
# Abuse-monitoring opt-out is not configured; enable it only with existing written approval.
model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: foundry-gpt
    litellm_params:
      model: azure/os.environ/AZURE_OPENAI_DEPLOYMENT
      api_base: os.environ/AZURE_API_BASE
      api_version: os.environ/AZURE_API_VERSION
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
guardrails:
  - guardrail_name: presidio-pii
    litellm_params:
      guardrail: presidio
      mode: [pre_call, post_call]
      default_on: true
      presidio_analyzer_api_base: os.environ/PRESIDIO_ANALYZER_API_BASE
      presidio_anonymizer_api_base: os.environ/PRESIDIO_ANONYMIZER_API_BASE
  - guardrail_name: presidio-mcp
    litellm_params:
      guardrail: presidio
      mode: pre_mcp_call
      default_on: true
litellm_settings:
  telemetry: false
  callbacks: []
general_settings:
  database_url: os.environ/DATABASE_URL
