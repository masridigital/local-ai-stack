---
# Password is never given a default. Pass backups_password from Ansible Vault.
# Timers stay disabled until that value is present. The role does not fail
# the rest of the site when the password is still empty.
# The password file is written mode 0600 and owned by root. A missing, empty,
# or loose file makes the backup and restore-test scripts exit non-zero.
# backups_extra_env cannot set RESTIC_PASSWORD or RESTIC_PASSWORD_COMMAND.
# The repository is a local absolute path on the LUKS volume. Off-host
# repository URLs are refused: restic has no egress rule.
# A second local absolute path may be set in backups_offsite_repository.
# A failed backup starts restic-failure.service. That unit loads alert.env
# only, and the alert script exits non-zero until backups_alert_hook is an
# executable absolute path. The hook is not given the restic password.
# Chat snapshots are kept 30 days. Audit snapshots are kept for the 6-year
# HIPAA documentation window. The quarterly timer restores the audit tag only.
backups_password: ""
backups_repository: /var/lib/local-ai-stack/backups/repo
backups_offsite_repository: ""
backups_password_file: /etc/restic/password
backups_env_file: /etc/restic/local-ai.env
backups_alert_env_file: /etc/restic/alert.env
backups_keep_daily_ephi: 30
backups_keep_daily_audit: 7
backups_keep_weekly_audit: 4
backups_keep_monthly_audit: 60
backups_keep_yearly_audit: 6
backups_extra_env: {}
backups_alert_hook: ""
