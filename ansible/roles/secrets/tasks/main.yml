---
- name: root-only secret files from the environment
  ansible.builtin.command: bash {{ repo_root }}/deploy/write-secret.sh {{ item.dest }} {{ item.env }}
  loop:
    - {dest: /etc/postgres/postgres_password, env: POSTGRES_PASSWORD}
    - {dest: /etc/litellm/litellm_master_key, env: LITELLM_MASTER_KEY}
    - {dest: /etc/litellm/anthropic_api_key, env: ANTHROPIC_API_KEY}
    - {dest: /etc/litellm/azure_client_secret, env: AZURE_CLIENT_SECRET}
    - {dest: /etc/litellm/database_url, env: DATABASE_URL}
    - {dest: /etc/policy-gateway/litellm_virtual_key, env: LITELLM_VIRTUAL_KEY}
    - {dest: /etc/policy-gateway/audit_database_url, env: AUDIT_DATABASE_URL}
    - {dest: /etc/open-webui/webui_secret_key, env: WEBUI_SECRET_KEY}
    - {dest: /etc/open-webui/microsoft_client_secret, env: MICROSOFT_CLIENT_SECRET}
    - {dest: /etc/open-webui/litellm_virtual_key, env: LITELLM_VIRTUAL_KEY}
    - {dest: /etc/cloudflared/credentials.json, env: CLOUDFLARED_CREDENTIALS_JSON}
  changed_when: false
  no_log: true
