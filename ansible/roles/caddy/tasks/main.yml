---
- name: Caddyfile
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/Caddyfile"
    dest: /etc/caddy/Caddyfile
    mode: "0644"

- name: Caddy hardening
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/systemd/caddy.service.d.conf"
    dest: /etc/systemd/system/caddy.service.d/10-hardening.conf
    mode: "0644"

- name: enable caddy
  ansible.builtin.systemd:
    name: caddy.service
    enabled: true
    daemon_reload: true
