---
- name: local-ai-stack native
  hosts: local_ai
  become: true
  vars:
    repo_root: "{{ playbook_dir }}/.."
  roles:
    - common
    - secrets
    - postgres
    - presidio_analyzer
    - presidio_anonymizer
    - litellm
    - policy_gateway
    - open_webui
    - caddy
    - wireguard
    - firewall
    - retention
    - backups
