name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: install pinned presidio
        run: |
          python -m pip install --require-hashes \
            -r requirements/presidio-anonymizer.txt \
            -r requirements/presidio-analyzer.txt \
            -r requirements/spacy-model.txt
      - name: pytest
        run: pytest
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck deploy/install.sh deploy/apt-repos.sh deploy/caddy-key.sh deploy/write-secret.sh deploy/litellm-run.sh deploy/open-webui-run.sh deploy/break-glass-enable.sh deploy/litellm-baa-dropin.sh deploy/egress-refresh.sh deploy/check-password-login.sh deploy/health-check.sh host/install.sh host/ufw.sh host/luks-data.sh host/secrets/populate.sh scripts/install_gitleaks.sh
      - name: bandit
        run: bandit -r stack scripts -q -ll
      - name: gitleaks
        run: |
          bash scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose --config .gitleaks.toml
      - name: sbom
        run: python scripts/generate_sbom.py sbom.cdx.json
      - name: trivy filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
