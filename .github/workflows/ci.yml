name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
          pip install -r requirements-dev.txt
      - name: pytest
        run: pytest
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck \
            deploy/install.sh \
            deploy/apt-repos.sh \
            deploy/caddy-key.sh \
            deploy/write-secret.sh \
            deploy/litellm-run.sh \
            deploy/open-webui-run.sh \
            deploy/break-glass-enable.sh \
            deploy/litellm-baa-dropin.sh \
            deploy/egress-refresh.sh \
            deploy/check-password-login.sh \
            deploy/health-check.sh \
            deploy/backup/restic-env.sh \
            deploy/backup/restic-backup.sh \
            deploy/backup/restic-restore-test.sh \
            deploy/backup/restic-alert.sh \
            host/install.sh \
            host/ufw.sh \
            host/luks-data.sh \
            host/secrets/populate.sh
      - name: bandit
        run: bandit -r stack scripts -q -ll
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: sbom
        run: python scripts/generate_sbom.py sbom.cdx.json
      - name: trivy filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
